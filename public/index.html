<script>
const HF_FILES = 'https://pika-labs-pika-h3-flex.hf.space';
let mode = 'Text';

const $ = id => document.getElementById(id);

document.querySelectorAll('[data-mode]').forEach(button => {
  button.addEventListener('click', () => {
    mode = button.dataset.mode;

    document.querySelectorAll('[data-mode]').forEach(item => {
      item.classList.toggle('active', item === button);
    });

    $('framesBox').style.display = mode === 'Frames' ? 'block' : 'none';
    $('refsBox').style.display = mode === 'References' ? 'block' : 'none';
  });
});

$('seconds').addEventListener('input', () => {
  $('secLabel').textContent = $('seconds').value;
});

[['firstImage', 'firstPreview'], ['lastImage', 'lastPreview']].forEach(([input, preview]) => {
  $(input).addEventListener('change', () => {
    const file = $(input).files[0];
    if (!file) return;

    $(preview).src = URL.createObjectURL(file);
    $(preview).style.display = 'block';
  });
});

function status(message) {
  $('status').style.display = 'block';
  $('status').textContent = message;
}

async function uploadFile(file) {
  const form = new FormData();
  form.append('files', file);

  const response = await fetch('/api/upload', {
    method: 'POST',
    body: form
  });

  if (!response.ok) {
    throw new Error('Upload failed: ' + await response.text());
  }

  const data = await response.json();
  const item = Array.isArray(data) ? data[0] : data;

  const path = typeof item === 'string'
    ? item
    : item.path || item.name;

  if (!path) throw new Error('No uploaded file path returned.');

  return {
    path,
    url: item.url || null,
    size: item.size || file.size,
    orig_name: item.orig_name || file.name,
    mime_type: item.mime_type || file.type,
    is_stream: false,
    meta: { _type: 'gradio.FileData' }
  };
}

function findVideo(obj) {
  if (!obj) return null;

  if (Array.isArray(obj)) {
    for (const item of obj) {
      const result = findVideo(item);
      if (result) return result;
    }
  }

  if (typeof obj === 'object') {
    if (typeof obj.url === 'string' && /\.(mp4|webm|mov)(\?|$)/i.test(obj.url)) return obj;
    if (typeof obj.path === 'string' && /\.(mp4|webm|mov)(\?|$)/i.test(obj.path)) return obj;

    for (const value of Object.values(obj)) {
      const result = findVideo(value);
      if (result) return result;
    }
  }

  if (typeof obj === 'string' && /\.(mp4|webm|mov)(\?|$)/i.test(obj)) {
    return { url: obj };
  }

  return null;
}

async function getResult(eventId) {
  const response = await fetch(
    '/api/call/generate/' + encodeURIComponent(eventId)
  );

  if (!response.ok) {
    throw new Error('Result request failed: ' + response.status);
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();

  let buffer = '';

  while (true) {
    const { value, done } = await reader.read();

    if (done) break;

    buffer += decoder.decode(value, { stream: true });

    const blocks = buffer.split('\n\n');
    buffer = blocks.pop();

    for (const block of blocks) {
      const eventLine = block.split('\n').find(line => line.startsWith('event:'));
      const dataLine = block.split('\n').find(line => line.startsWith('data:'));

      if (!dataLine) continue;

      const event = eventLine ? eventLine.slice(6).trim() : '';
      const raw = dataLine.slice(5).trim();

      let data;
      try {
        data = JSON.parse(raw);
      } catch {
        data = raw;
      }

      if (event === 'error') {
        throw new Error(typeof data === 'string' ? data : JSON.stringify(data));
      }

      if (event === 'generating') {
        status('Generating video... Please wait.');
      }

      if (event === 'complete') {
        return data;
      }
    }
  }

  throw new Error('Generation stream ended without a completed result.');
}

$('generate').addEventListener('click', async () => {
  const prompt = $('prompt').value.trim();

  if (!prompt) {
    status('Please enter a video prompt.');
    return;
  }

  if (mode === 'Frames' && !$('firstImage').files[0]) {
    status('Please upload a first-frame image.');
    return;
  }

  $('generate').disabled = true;
  $('result').style.display = 'none';

  try {
    let firstImage = null;
    let lastImage = null;
    const referenceFiles = [];

    if (mode === 'Frames') {
      status('Uploading first frame...');
      firstImage = await uploadFile($('firstImage').files[0]);

      if ($('lastImage').files[0]) {
        status('Uploading last frame...');
        lastImage = await uploadFile($('lastImage').files[0]);
      }
    }

    if (mode === 'References') {
      const files = [...$('refs').files];

      if (!files.length) {
        throw new Error('Please select reference files.');
      }

      for (let i = 0; i < files.length; i++) {
        status(`Uploading reference ${i + 1}/${files.length}...`);
        referenceFiles.push(await uploadFile(files[i]));
      }
    }

    const body = {
      data: [
        prompt,
        mode,
        firstImage,
        lastImage,
        referenceFiles,
        $('resolution').value,
        $('aspect').value,
        Number($('seconds').value),
        Number($('seed').value) || 42,
        $('randomize').checked
      ]
    };

    status('Submitting video generation request...');

    const start = await fetch('/api/call/v2/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const startText = await start.text();

    if (!start.ok) {
      throw new Error('Generation request failed: ' + startText);
    }

    const startData = JSON.parse(startText);

    if (!startData.event_id) {
      throw new Error('No event ID returned: ' + startText);
    }

    status('Request accepted. Generating video...');

    const output = await getResult(startData.event_id);
    const videoData = findVideo(output);

    if (!videoData) {
      throw new Error('Video URL not found: ' + JSON.stringify(output));
    }

    let source = videoData.url || videoData.path;

    if (source && !/^https?:\/\//i.test(source)) {
      source = HF_FILES + '/file=' + encodeURIComponent(source);
    }

    $('video').src = source;
    $('download').href = source;
    $('result').style.display = 'block';

    status('Video generated successfully!');
  } catch (error) {
    status('ERROR: ' + error.message);
  } finally {
    $('generate').disabled = false;
  }
});
</script>
